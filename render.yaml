services:
  - type: web
    name: ustradertext
    runtime: python
    buildCommand: ""
    startCommand: python3 rest_proxy_server.py
    envVars:
      - key: MASSIVE_PROXY_KEY
        sync: false
      - key: UPSTREAM_REST_BASE
        value: http://44.219.45.87:8081
      - key: ALPACA_KEY_ID
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_DATA_BASE
        value: https://data.alpaca.markets
      - key: ALPACA_TRADING_BASE
        value: https://paper-api.alpaca.markets
